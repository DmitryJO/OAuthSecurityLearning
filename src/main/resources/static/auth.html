<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Auth</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            background-color: white;
            border-radius: 1em;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            text-align: center;
            width: 500px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .mainBlock {
            background-color: #007bff;
            border-radius: 0.5em;
            padding: 15px;
            margin-top: 20px;
            transition: background-color 0.3s, transform 0.3s;
        }

        .mainBlock a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .mainBlock:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        @media (max-width: 400px) {
            .container {
                width: 90%;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Поздравляю!!</h1>
    <h1>Вы вошли используя OAuth2!!!</h1>

    <div class="mainBlock">
        <a href="/home">Домой</a>
    </div>
</div>
</body>
</html>
